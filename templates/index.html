<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 鬼面接官 - ES評価ツール</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <!-- React & Babel CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.0/babel.min.js"></script>
    <!-- Supabase JavaScript クライアントライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
    </style>
</head>
<body class="bg-gray-900">
    <div id="root"></div>

    <script type="text/babel">
    {% raw %}
        // --- React Hooksの宣言 ---
        const { useState, useEffect, useCallback, useRef } = React;

        // 🚨 Supabase クライアントの初期化 (ユーザーのキーに修正が必要) 🚨
        const SUPABASE_URL = 'https://aatnytjiaucroeynlurm.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhdG55dGppYXVjcm9leW5sdXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNzUyNzYsImV4cCI6MjA3OTY1MTI3Nn0.9VHG3PIrph7XgBRqz00hyVScbUc_JIQcyShaoFJtX_0'; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 子コンポーネント: 入力フォーム ---
        const InputForm = ({ onSubmit, loading, esText, setEsText, companyName, setCompanyName, category, setCategory, targetLength, setTargetLength, user }) => {
            return (
                <div className="bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-xl space-y-4">
                    <form onSubmit={onSubmit} className="space-y-4">
                        <input
                            type="text"
                            value={companyName}
                            onChange={(e) => setCompanyName(e.target.value)}
                            placeholder="志望企業名 (例: アクセンチュア, 空欄OK)"
                            className="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:ring-red-500 focus:border-red-500 text-sm"
                        />
                        <div className="grid grid-cols-2 gap-3">
                            <select
                                value={category}
                                onChange={(e) => setCategory(e.target.value)}
                                className="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white focus:ring-red-500 focus:border-red-500 appearance-none text-sm"
                            >
                                {['志望動機', 'ガクチカ', '自己PR', 'その他'].map(opt => (
                                    <option key={opt} value={opt}>{opt}</option>
                                ))}
                            </select>
                            <input
                                type="number"
                                value={targetLength}
                                onChange={(e) => setTargetLength(e.target.value)}
                                placeholder="目標文字数 (例: 400)"
                                min="0"
                                className="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:ring-red-500 focus:border-red-500 text-sm"
                            />
                        </div>
                        <div>
                            <textarea
                                value={esText}
                                onChange={(e) => setEsText(e.target.value)}
                                rows="8"
                                placeholder="あなたのES本文を入力してください。"
                                className="w-full p-3 bg-gray-700 border border-gray-600 rounded-xl text-white placeholder-gray-500 focus:ring-red-500 focus:border-red-500 resize-none text-sm"
                                required
                            />
                            <div className="text-right text-xs text-gray-400 mt-1">
                                現在: {esText.length} 文字
                            </div>
                        </div>
                        <button
                            type="submit"
                            disabled={loading || esText.length === 0}
                            className={`w-full py-3 rounded-xl font-bold transition duration-150 flex items-center justify-center 
                                ${loading || esText.length === 0 ? 'bg-gray-600 text-gray-400 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 text-white shadow-lg shadow-red-500/50'}`}
                        >
                            {loading ? (
                                <div className="flex items-center">
                                    <svg className="animate-spin h-5 w-5 text-white mr-3" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    面接官がESを熟読中...
                                </div>
                            ) : (
                                'AIにガチ採点してもらう'
                            )}
                        </button>
                    </form>
                </div>
            );
        };

        // --- 子コンポーネント: 結果表示 ---
        const ResultDisplay = ({ result, avgData, handleShare, originalText, companyName, category, onRewriteComplete, user }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const [rewrittenText, setRewrittenText] = useState(null);
            const [rewriteLoading, setRewriteLoading] = useState(false);
            const [showRewriteModal, setShowRewriteModal] = useState(false);

            // 🚨 ユーザーが取得したStripeのテスト用決済リンク
            const STRIPE_CHECKOUT_URL = "https://buy.stripe.com/test_00wdR911Sfkq7943bze3e00";

            useEffect(() => {
                if (result && result.scores && window.Chart) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    const ctx = chartRef.current.getContext('2d');
                    
                    chartInstance.current = new Chart(ctx, {
                        type: 'radar',
                        data: {
                            labels: ["論理性", "具体性", "熱意", "自己分析", "将来性"],
                            datasets: [
                                {
                                    label: 'あなたのスコア',
                                    data: result.scores,
                                    backgroundColor: 'rgba(255, 99, 132, 0.4)',
                                    borderColor: 'rgba(255, 99, 132, 1)',
                                    borderWidth: 2,
                                },
                                {
                                    label: '平均スコア',
                                    data: avgData,
                                    backgroundColor: 'rgba(108, 117, 125, 0.2)',
                                    borderColor: 'rgba(108, 117, 125, 0.8)',
                                    borderWidth: 1,
                                }
                            ]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                r: {
                                    suggestedMin: 0,
                                    suggestedMax: 20,
                                    angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
                                    grid: { color: 'rgba(255, 255, 255, 0.2)' },
                                    pointLabels: { color: 'white', font: { size: 12 } },
                                    ticks: { backdropColor: 'transparent', stepSize: 5, display: false }
                                }
                            },
                            plugins: {
                                legend: { position: 'bottom', labels: { color: 'white' } }
                            },
                        },
                    });
                }
            }, [result, avgData]);

            const handleRewrite = async () => {
                if (!originalText || !result) return;
                
                // 未ログインユーザーへの対応
                if (!user) {
                    alert('リライト機能を利用するにはログインが必要です。');
                    return;
                }
                
                // ログイン済みユーザーをStripe決済ページへリダイレクト
                window.location.href = STRIPE_CHECKOUT_URL;
            };

            if (result && result.error) {
                return <div className="bg-red-900 p-4 rounded-xl text-center"><p className="font-bold">🚨 エラー</p><p className="text-sm">{result.error}</p></div>;
            }
            if (!result || !result.scores) {
                return <div className="text-center p-8 bg-gray-800 rounded-2xl shadow-xl"><p className="text-gray-400">結果はここに表示されます</p></div>;
            }

            const totalScore = result.total_score || 0;
            const verdictColor = result.result === '合格' ? 'bg-green-600' : 'bg-red-600';
            const verdictText = result.result === '合格' ? '合格' : '不合格';

            return (
                <>
                    <div className="bg-gray-800 p-4 sm:p-6 rounded-2xl shadow-xl space-y-6">
                        <div className="text-center border-b border-gray-700 pb-4">
                            <div className={`text-2xl font-bold px-4 py-1 rounded-full inline-block mb-2 text-white ${verdictColor}`}>
                                判定：{verdictText}
                            </div>
                            <div className="text-5xl font-black text-white">{totalScore} <span className="text-xl font-light text-gray-400">/ 100</span></div>
                            <div className="flex gap-2 justify-center mt-4">
                                <button onClick={handleShare} className="px-4 py-2 bg-black rounded-full font-bold text-sm text-white inline-flex items-center gap-2 hover:bg-gray-900">
                                    <span>X でシェア</span>
                                </button>
                                <button 
                                    onClick={handleRewrite}
                                    disabled={rewriteLoading}
                                    className={`px-4 py-2 rounded-full font-bold text-sm inline-flex items-center gap-2 ${
                                        rewriteLoading 
                                            ? 'bg-gray-600 text-gray-400 cursor-not-allowed' 
                                            : 'bg-blue-600 hover:bg-blue-700 text-white'
                                    }`}
                                >
                                    {rewriteLoading ? (
                                        <>
                                            <svg className="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                            </svg>
                                            <span>リライト中...</span>
                                        </>
                                    ) : (
                                        <span>✨ AIにリライトさせる</span>
                                    )}
                                </button>
                            </div>
                        </div>
                        
                        <div className="relative h-64 w-full">
                            <canvas ref={chartRef}></canvas>
                        </div>

                        <div className="space-y-4">
                            <div className="bg-gray-700 p-4 rounded-lg"><h3 className="font-bold text-green-400">✅ 良い点</h3><ul className="list-disc pl-4 text-sm text-gray-300">{result.good_points?.map((p,i)=><li key={i}>{p}</li>)}</ul></div>
                            <div className="bg-gray-700 p-4 rounded-lg"><h3 className="font-bold text-red-400">❌ 改善点</h3><ul className="list-disc pl-4 text-sm text-gray-300">{result.bad_points?.map((p,i)=><li key={i}>{p}</li>)}</ul></div>
                            <div className="bg-gray-700 p-4 rounded-lg border-l-4 border-red-500"><h3 className="font-bold text-white">💡 アドバイス</h3><p className="text-sm text-gray-300 whitespace-pre-line">{result.advice}</p></div>
                        </div>
                    </div>

                    {/* リライト結果モーダル */}
                    {showRewriteModal && rewrittenText && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={() => setShowRewriteModal(false)}>
                            <div className="bg-gray-800 rounded-2xl shadow-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto" onClick={(e) => e.stopPropagation()}>
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold text-white">✨ リライトされたES</h2>
                                        <button 
                                            onClick={() => setShowRewriteModal(false)}
                                            className="text-gray-400 hover:text-white text-2xl"
                                        >
                                            ×
                                        </button>
                                    </div>
                                    <div className="bg-gray-900 p-4 rounded-lg mb-4">
                                        <p className="text-white whitespace-pre-line text-sm leading-relaxed">{rewrittenText}</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                navigator.clipboard.writeText(rewrittenText);
                                                alert('クリップボードにコピーしました！');
                                            }}
                                            className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-sm"
                                        >
                                            コピー
                                        </button>
                                        <button
                                            onClick={() => {
                                                if (onRewriteComplete) {
                                                    onRewriteComplete(rewrittenText);
                                                }
                                                setShowRewriteModal(false);
                                            }}
                                            className="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg font-bold text-sm"
                                        >
                                            この内容で再評価
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // --- メインアプリ ---
        const App = () => {
            const [companyName, setCompanyName] = useState('');
            const [category, setCategory] = useState('志望動機');
            const [targetLength, setTargetLength] = useState('');
            const [esText, setEsText] = useState('');
            const [result, setResult] = useState(null);
            const [avgData, setAvgData] = useState([16, 15, 17, 15, 16]);
            const [loading, setLoading] = useState(false);
            const [originalText, setOriginalText] = useState('');
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);

            // API URL (相対パス)
            const API_URL = "/api/evaluate";

            // --- 認証状態の監視 ---
            useEffect(() => {
                const { data: authListener } = supabase.auth.onAuthStateChange(
                    (event, session) => {
                        setUser(session?.user ?? null);
                        setAuthLoading(false);
                    }
                );

                supabase.auth.getSession().then(({ data: { session } }) => {
                    setUser(session?.user ?? null);
                    setAuthLoading(false);
                });

                return () => { authListener?.unsubscribe(); };
            }, []);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!esText.trim()) return;
                setLoading(true);
                setResult(null);
                setOriginalText(esText);

                const formData = new URLSearchParams();
                formData.append('company_name', companyName);
                formData.append('category', category);
                formData.append('target_length', targetLength);
                formData.append('es_text', esText);

                // ログインしている場合（userが存在する場合）、user.idをフォームデータに追加
                if (user) {
                    formData.append('user_id', user.id);
                }

                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || '通信エラー');
                    setResult(data.result);
                    setAvgData(data.average);
                } catch (err) {
                    setResult({ error: err.message });
                } finally {
                    setLoading(false);
                }
            };

            const handleRewriteComplete = (rewrittenText) => {
                setEsText(rewrittenText);
            };

            const handleShare = () => {
                if (!result) return;
                const text = `【AI就活】ESスコア：${result.total_score}点（${result.result}） #ES道場`;
                const url = window.location.href;
                window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
            };

            // --- 認証関連の関数 ---
            const handleLogin = async () => {
                setAuthLoading(true);
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: 'google', 
                    options: {
                        redirectTo: window.location.href, 
                    },
                });
                if (error) {
                    console.error('Login error:', error);
                    alert(`ログインエラー: ${error.message}`);
                }
                setAuthLoading(false);
            };

            const handleLogout = async () => {
                const { error } = await supabase.auth.signOut();
                if (error) console.error('Logout error:', error);
                setUser(null);
            };

            // --- UIコンポーネント: 認証状態 ---
            const AuthUI = () => {
                if (authLoading) {
                    return <div className="text-center text-gray-400 text-sm">認証中...</div>;
                }
                if (user) {
                    return (
                        <div className="flex items-center space-x-3 bg-gray-700 p-2 rounded-xl">
                            <p className="text-sm text-white">
                                {user.email ? user.email.substring(0, user.email.indexOf('@')) : 'ログイン済み'}
                            </p>
                            <button onClick={handleLogout} className="px-3 py-1 bg-red-600 text-white rounded-lg text-xs hover:bg-red-700 transition">
                                ログアウト
                            </button>
                        </div>
                    );
                }
                return (
                    <button onClick={handleLogin} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-bold hover:bg-blue-700 transition shadow-lg">
                        Googleでログイン
                    </button>
                );
            };

            return (
                <div className="min-h-screen p-4 md:p-8">
                    <div className="max-w-4xl mx-auto">
                        <header className="flex justify-between items-center mb-8 pt-4">
                            <div>
                                <h1 className="text-2xl font-extrabold text-white">AI 鬼面接官</h1>
                                <p className="text-red-400 text-sm">ES偏差値 厳格採点ツール</p>
                            </div>
                            <AuthUI />
                        </header>
                        <main className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <InputForm 
                                onSubmit={handleSubmit} 
                                loading={loading} 
                                esText={esText} 
                                setEsText={setEsText} 
                                companyName={companyName} 
                                setCompanyName={setCompanyName}
                                category={category} 
                                setCategory={setCategory}
                                targetLength={targetLength} 
                                setTargetLength={setTargetLength}
                                user={user}
                            />
                            <ResultDisplay 
                                result={result} 
                                avgData={avgData} 
                                handleShare={handleShare}
                                originalText={originalText}
                                companyName={companyName}
                                category={category}
                                onRewriteComplete={handleRewriteComplete}
                                user={user}
                            />
                        </main>
                        <footer className="text-center text-gray-500 text-xs mt-12">
                            <p>© 2025 ES Evaluator App.</p>
                        </footer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    {% endraw %}
    </script>
</body>
</html>
